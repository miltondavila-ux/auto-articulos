services:
  postgres:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: autoarticulos
      POSTGRES_PASSWORD: autoarticulos
      POSTGRES_DB: autoarticulos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoarticulos"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: "no"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://autoarticulos:autoarticulos@postgres:5432/autoarticulos?schema=public
      SESSION_SECRET: ${SESSION_SECRET}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: postgresql://autoarticulos:autoarticulos@postgres:5432/autoarticulos?schema=public
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
