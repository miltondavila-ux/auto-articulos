name: Diagnóstico temporal de usuario

on:
  workflow_dispatch:
    inputs:
      email:
        description: Correo del usuario
        required: true

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DATABASE_URL }}
      TARGET_EMAIL: ${{ inputs.email }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate --schema=packages/db/prisma/schema.prisma
      - name: Consultar estado sin modificar datos
        run: |
          node <<'NODE'
          const { PrismaClient } = require("@prisma/client");
          const prisma = new PrismaClient();
          (async () => {
            const user = await prisma.user.findUnique({
              where: { email: process.env.TARGET_EMAIL },
              select: {
                email: true,
                workerBusyUntil: true,
                monthlyArticleLimit: true,
                dailyArticleLimit: true,
                _count: { select: { credentials: true, categories: true } },
                categorySyncJobs: {
                  orderBy: { createdAt: "desc" },
                  take: 3,
                  select: {
                    status: true,
                    errorMessage: true,
                    createdAt: true,
                    finishedAt: true,
                  },
                },
                runs: {
                  orderBy: { createdAt: "desc" },
                  take: 5,
                  select: {
                    id: true,
                    status: true,
                    createdAt: true,
                    finishedAt: true,
                    titles: {
                      orderBy: { order: "asc" },
                      select: {
                        status: true,
                        attempts: true,
                        errorMessage: true,
                        processedAt: true,
                        events: {
                          orderBy: { createdAt: "desc" },
                          take: 1,
                          select: { message: true, createdAt: true },
                        },
                      },
                    },
                  },
                },
              },
            });
            console.log(JSON.stringify({ found: Boolean(user), user }, null, 2));
          })().finally(() => prisma.$disconnect());
          NODE
