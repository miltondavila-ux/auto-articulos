name: Reparar artículo DEV.to

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL exacta del artículo DEV.to que se debe reparar"
        required: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEVTO_TARGET_URL: ${{ github.event.inputs.target_url }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DATABASE_URL }}
      CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate --schema=packages/db/prisma/schema.prisma
      - name: Reparar artículo existente en DEV.to
        working-directory: apps/worker
        run: npx tsx src/repair-devto.ts
