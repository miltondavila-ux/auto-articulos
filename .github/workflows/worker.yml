name: Worker de Auto Artículos

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: auto-articulos-worker
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Varios "shards" idénticos corren en paralelo (pedido explícito del
    # usuario el 31/7/2026, por carga real de ~40 usuarios activos a la
    # vez): cada uno es un proceso de Node completamente separado que
    # compite por el mismo trabajo pendiente en la base de datos. El
    # reparto es automático y seguro entre-procesos gracias al "claim"
    # atómico de reservation.ts (User.workerBusyUntil) — nunca dos shards
    # abren sesión contra la MISMA cuenta de 10minutesWebsite a la vez,
    # pero usuarios distintos avanzan todos en paralelo. No hace falta
    # asignar manualmente qué shard procesa a quién.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DATABASE_URL }}
      CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_SEARCH_CONSOLE_CLIENT_ID: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CLIENT_ID }}
      GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npx prisma generate --schema=packages/db/prisma/schema.prisma

      - name: Cache de navegadores de Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Procesar trabajo pendiente
        working-directory: apps/worker
        run: npm run run-once
