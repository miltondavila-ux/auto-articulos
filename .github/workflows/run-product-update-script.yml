name: Database Write - Run ProductUpdate script

# Reutilizable a propósito: el compromiso registrado en
# COORDINACION_CLAUDE_CODEX.md (23/8/2026) es agregar una entrada de
# ProductUpdate por cada cambio visible que se publique, y crear un
# workflow .yml nuevo por cada una habría llenado .github/workflows/ de
# archivos de un solo uso. En vez de eso, cada cambio visible agrega su
# propio script en scripts/ (mismo patrón que seed-product-updates.ts) y
# lo corre con este workflow, pasando su ruta como input.
on:
  workflow_dispatch:
    inputs:
      script_path:
        description: "Ruta del script a correr, relativa a la raíz del repo (ej: scripts/add-product-update-20260823-chart.ts)"
        required: true
        type: string

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DATABASE_URL }}
      SCRIPT_PATH: ${{ inputs.script_path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npx prisma generate --schema=packages/db/prisma/schema.prisma

      - name: Correr script
        # SCRIPT_PATH pasa por una variable de entorno, no por interpolación
        # directa de ${{ }} en el comando: workflow_dispatch inputs son texto
        # arbitrario, e interpolarlos directo en `run:` permite inyección de
        # comandos si alguien pusiera comillas o backticks en el input.
        run: npx tsx "$SCRIPT_PATH"
