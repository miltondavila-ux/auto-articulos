name: Database Query - Diagnose Category Sync

on:
  workflow_dispatch:
    inputs:
      user_email_query:
        description: "Correo o fragmento de correo/nombre del usuario a diagnosticar"
        required: true
        type: string

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DATABASE_URL }}
      USER_EMAIL_QUERY: ${{ inputs.user_email_query }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npx prisma generate --schema=packages/db/prisma/schema.prisma

      - name: Diagnosticar sincronización de categorías
        working-directory: apps/worker
        run: npx tsx src/diagnose-category-sync.ts
