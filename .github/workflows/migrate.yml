name: Migración manual de base de datos

on:
  workflow_dispatch:
    inputs:
      seed_product_updates:
        description: "Reponer entradas históricas de Actualizaciones si faltan"
        required: false
        default: false
        type: boolean
      accept_data_loss:
        description: "Aceptar advertencia de posible pérdida de datos (revisar el motivo ANTES de marcar esto)"
        required: false
        default: false
        type: boolean
      safe_opportunity_dates:
        description: "Aplicar solo las columnas seguras de fechas de oportunidades/publicaciones"
        required: false
        default: false
        type: boolean
      safe_daily_limit_default:
        description: "Aplicar solo el nuevo valor por defecto (5) de dailyArticleLimit, sin tocar nada mas del schema"
        required: false
        default: false
        type: boolean
      safe_blogger_integration:
        description: "Aplicar únicamente las tablas y columnas nuevas de la integración Blogger"
        required: false
        default: false
        type: boolean

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Generar cliente de Prisma
        # Necesario explícitamente: cuando corre una ruta "safe_*" (que solo
        # hace `prisma db execute`, sin `db push`), nada más en este job
        # genera el cliente, y el paso de RLS de más abajo lo necesita
        # (usa @prisma/client). `db push` también lo regenera por su cuenta,
        # así que correrlo aquí es redundante pero inofensivo en esa ruta.
        run: npx prisma generate --schema=packages/db/prisma/schema.prisma
      # Prisma Migrate necesita una sesión estable para prepared statements y
      # advisory locks. El runtime serverless usa el Transaction pooler :6543,
      # pero una migración aislada debe usar el Session pooler :5432 (una sola
      # conexión, dentro del límite de 15). Nunca imprime la URL ni el secreto.
      - name: Aplicar migración segura de fechas de oportunidades
        if: ${{ inputs.safe_opportunity_dates }}
        shell: bash
        run: |
          MIGRATION_DATABASE_URL="${DATABASE_URL/:6543/:5432}"
          MIGRATION_DATABASE_URL="${MIGRATION_DATABASE_URL/?pgbouncer=true/}"
          npx prisma db execute \
            --url "$MIGRATION_DATABASE_URL" \
            --file packages/db/prisma/migrations/20260827130000_add_opportunity_publication_dates/migration.sql
      - name: Aplicar migracion segura de limite diario por defecto
        if: ${{ inputs.safe_daily_limit_default }}
        shell: bash
        run: |
          MIGRATION_DATABASE_URL="${DATABASE_URL/:6543/:5432}"
          MIGRATION_DATABASE_URL="${MIGRATION_DATABASE_URL/?pgbouncer=true/}"
          npx prisma db execute \
            --url "$MIGRATION_DATABASE_URL" \
            --file packages/db/prisma/migrations/20260831230000_set_daily_limit_5_default/migration.sql
      - name: Aplicar migración segura de Blogger
        if: ${{ inputs.safe_blogger_integration }}
        shell: bash
        run: |
          MIGRATION_DATABASE_URL="${DATABASE_URL/:6543/:5432}"
          MIGRATION_DATABASE_URL="${MIGRATION_DATABASE_URL/?pgbouncer=true/}"
          npx prisma db execute \
            --url "$MIGRATION_DATABASE_URL" \
            --file packages/db/prisma/migrations/20260902150000_add_blogger_integration/migration.sql
      - name: Aplicar migraciones con Session pooler
        if: ${{ !inputs.safe_opportunity_dates && !inputs.safe_daily_limit_default && !inputs.safe_blogger_integration }}
        shell: bash
        run: |
          MIGRATION_DATABASE_URL="${DATABASE_URL/:6543/:5432}"
          MIGRATION_DATABASE_URL="${MIGRATION_DATABASE_URL/?pgbouncer=true/}"
          DATABASE_URL="$MIGRATION_DATABASE_URL" DIRECT_URL="$MIGRATION_DATABASE_URL" \
            npx prisma db push --schema=packages/db/prisma/schema.prisma \
            ${{ inputs.accept_data_loss && '--accept-data-loss' || '' }}
      - name: Forzar RLS en tablas públicas (salvaguarda, idempotente)
        # Este proyecto aplica el esquema con `prisma db push`, que no lee
        # las migraciones SQL versionadas ni activa RLS por sí solo. Sin este
        # paso, cualquier tabla nueva en `public` queda expuesta por
        # completo vía PostgREST hasta que alguien la active a mano (así
        # quedaron expuestas 26 tablas hasta 2026-09-02, ver
        # COORDINACION_CLAUDE_CODEX.md). Corre siempre, sin política nueva,
        # solo activa RLS donde falte.
        shell: bash
        run: |
          MIGRATION_DATABASE_URL="${DATABASE_URL/:6543/:5432}"
          MIGRATION_DATABASE_URL="${MIGRATION_DATABASE_URL/?pgbouncer=true/}"
          DATABASE_URL="$MIGRATION_DATABASE_URL" DIRECT_URL="$MIGRATION_DATABASE_URL" \
            npm run enforce-rls --workspace=packages/db
      - name: Reponer Actualizaciones históricas (idempotente)
        if: ${{ inputs.seed_product_updates }}
        run: npx tsx scripts/seed-product-updates.ts
