name: Migración manual de base de datos

on:
  workflow_dispatch: {}

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # Prisma Migrate necesita una sesión estable para prepared statements y
      # advisory locks. El runtime serverless usa el Transaction pooler :6543,
      # pero una migración aislada debe usar el Session pooler :5432 (una sola
      # conexión, dentro del límite de 15). Nunca imprime la URL ni el secreto.
      - name: Aplicar migraciones con Session pooler
        shell: bash
        run: |
          MIGRATION_DATABASE_URL="${DATABASE_URL/:6543/:5432}"
          MIGRATION_DATABASE_URL="${MIGRATION_DATABASE_URL/?pgbouncer=true/}"
          DATABASE_URL="$MIGRATION_DATABASE_URL" DIRECT_URL="$MIGRATION_DATABASE_URL" \
            npx prisma db push --schema=packages/db/prisma/schema.prisma
