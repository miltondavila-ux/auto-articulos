name: Worker de PRUEBAS (Auto Artículos)

# Pedido explícito de Milton (20/8/2026): probar cambios de programación en
# producción sin esperar detrás del worker real. Este workflow SOLO procesa
# el trabajo pendiente del usuario que se indique al dispararlo — nunca toca
# la cola de un cliente real — y usa su PROPIO concurrency group, separado
# del de worker.yml, así nunca hace fila detrás (ni el worker real detrás de
# éste). Ver run-test-once.ts y COORDINACION_CLAUDE_CODEX.md.
#
# Se dispara a mano:
#   gh workflow run worker-test.yml -f user_email=correo@delusuariodeprueba.com

on:
  workflow_dispatch:
    inputs:
      user_email:
        description: "Correo del usuario a probar (ej. la cuenta de Lorena Álvarez)"
        required: true
      article_url:
        description: "URL exacta del artículo a procesar (opcional; limita la prueba a este artículo)"
        required: false

concurrency:
  group: auto-articulos-worker-test
  cancel-in-progress: true

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WORKER_MODE: all
      WORKER_TEST_USER_EMAIL: ${{ github.event.inputs.user_email }}
      WORKER_TEST_ARTICLE_URL: ${{ github.event.inputs.article_url }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DATABASE_URL }}
      CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_IMAGE_API_KEY: ${{ secrets.OPENAI_IMAGE_API_KEY }}
      FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
      IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
      GOOGLE_SEARCH_CONSOLE_CLIENT_ID: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CLIENT_ID }}
      GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET }}
      BING_WEBMASTER_CLIENT_ID: ${{ secrets.BING_WEBMASTER_CLIENT_ID }}
      BING_WEBMASTER_CLIENT_SECRET: ${{ secrets.BING_WEBMASTER_CLIENT_SECRET }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npx prisma generate --schema=packages/db/prisma/schema.prisma

      - name: Cache de navegadores de Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Procesar SOLO el trabajo de este usuario
        working-directory: apps/worker
        run: npm run run-test-once
